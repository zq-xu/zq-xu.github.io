# Template for the high-availability multi-node layout.
# render-config.sh replaces ${NODE_IMAGE} and ${DATA_DIR} before use.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: ${NODE_IMAGE}
    extraMounts:
      - hostPath: "${DATA_DIR}/control-plane-1"
        containerPath: /var/local-path-provisioner
        readOnly: false
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: control-plane
    image: ${NODE_IMAGE}
    extraMounts:
      - hostPath: "${DATA_DIR}/control-plane-2"
        containerPath: /var/local-path-provisioner
        readOnly: false
  - role: control-plane
    image: ${NODE_IMAGE}
    extraMounts:
      - hostPath: "${DATA_DIR}/control-plane-3"
        containerPath: /var/local-path-provisioner
        readOnly: false
  - role: worker
    image: ${NODE_IMAGE}
    extraMounts:
      - hostPath: "${DATA_DIR}/worker-1"
        containerPath: /var/local-path-provisioner
        readOnly: false
  - role: worker
    image: ${NODE_IMAGE}
    extraMounts:
      - hostPath: "${DATA_DIR}/worker-2"
        containerPath: /var/local-path-provisioner
        readOnly: false
  - role: worker
    image: ${NODE_IMAGE}
    extraMounts:
      - hostPath: "${DATA_DIR}/worker-3"
        containerPath: /var/local-path-provisioner
        readOnly: false
