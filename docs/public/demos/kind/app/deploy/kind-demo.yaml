apiVersion: v1
kind: Namespace
metadata:
  name: kind-demo
  labels:
    app.kubernetes.io/part-of: kind-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kind-demo-config
  namespace: kind-demo
data:
  APP_VERSION: "v1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kind-demo
  namespace: kind-demo
  labels:
    app.kubernetes.io/name: kind-demo
    app.kubernetes.io/part-of: kind-demo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: kind-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kind-demo
        app.kubernetes.io/part-of: kind-demo
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kind-demo
      containers:
        - name: app
          image: kind-demo:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: kind-demo-config
                  key: APP_VERSION
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: kind-demo
  namespace: kind-demo
  labels:
    app.kubernetes.io/name: kind-demo
    app.kubernetes.io/part-of: kind-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kind-demo
  ports:
    - name: http
      port: 80
      targetPort: http
