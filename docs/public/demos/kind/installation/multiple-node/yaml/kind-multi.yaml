# Template for the standard multi-node layout.
# render-config.sh replaces ${NODE_IMAGE} and ${DATA_DIR} before use.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: ${NODE_IMAGE}
    extraMounts:
      - hostPath: "${DATA_DIR}/control-plane"
        containerPath: /var/local-path-provisioner
        readOnly: false
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
    image: ${NODE_IMAGE}
    extraMounts:
      - hostPath: "${DATA_DIR}/worker-1"
        containerPath: /var/local-path-provisioner
        readOnly: false
  - role: worker
    image: ${NODE_IMAGE}
    extraMounts:
      - hostPath: "${DATA_DIR}/worker-2"
        containerPath: /var/local-path-provisioner
        readOnly: false
