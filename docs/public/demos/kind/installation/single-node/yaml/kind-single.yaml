# Template for the single-node cluster.
# render-config.sh replaces ${NODE_IMAGE} and ${DATA_DIR} before use.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: ${NODE_IMAGE}
    extraMounts:
      - hostPath: "${DATA_DIR}"
        containerPath: /var/local-path-provisioner
        readOnly: false
